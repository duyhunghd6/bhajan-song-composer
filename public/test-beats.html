  4. Preventing Spacing Overlaps & Clipping:
     - The guitar tab staff is pushed down by 25px using CSS:
       `g.abcjs-staff:not(.abcjs-v0) { transform: translateY(25px); }`
     - To prevent the tab staff from being cut off or clipped by the SVG height limits, the
       following render options are auto-injected:
       * `stafftopmargin: 35`: reserves space above the tab staff inside the SVG viewport.
       * `paddingbottom: 60`: reserves space at the bottom of the page viewport.
