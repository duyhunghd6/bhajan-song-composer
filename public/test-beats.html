  2. ABC Notation for Beat Circles:
     - Beat circles are represented as a separate lyrics-like beat row using `w:` instead of
       custom annotations attached directly to melody notes.
     - Example: write the clean melody line first, then add `w: ⬤ * • * ● * • * |` below it.
     - This keeps melody notes unchanged while allowing abcjs to align beat icons like lyric syllables.

  3. SVG Post-Processing (Aligning below lyrics):
     - The function `postProcessBeats(container)` reads staff paths (`path.abcjs-staff`) and
       lyric elements (`text.abcjs-lyric`) dynamically using getBBox().
     - It classifies glyph-only lyric nodes as beat indicators, then repositions them 16px below
       the real lyric row when lyrics exist, or below the staff when no real lyrics exist.
     
  4. Preventing Spacing Overlaps & Clipping:
     - The guitar tab staff is pushed down by 25px using CSS:
       `g.abcjs-staff:not(.abcjs-v0) { transform: translateY(25px); }`
     - To prevent the tab staff from being cut off or clipped by the SVG height limits, the
       following render options are auto-injected:
       * `stafftopmargin: 35`: reserves space above the tab staff inside the SVG viewport.
       * `paddingbottom: 60`: reserves space at the bottom of the page viewport.
