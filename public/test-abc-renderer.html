<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ABCJS Display Bug Test</title>
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.6.3/dist/abcjs-basic-min.js" type="text/javascript"></script>
    <link href="https://cdn.jsdelivr.net/npm/abcjs@6.6.3/abcjs-audio.css" media="all" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            padding: 20px;
            color: #334155;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            background: #e2e8f0;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 500;
        }

        .controls label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .abc-container {
            max-width: 1000px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            overflow-x: auto;
        }

        /* ----- Styles from AbcjsPlaybackStyles.tsx ----- */
        #paper .abcjs-note,
        #paper .abcjs-chord {
          cursor: pointer;
        }

        #paper .abcjs-note-active,
        #paper .abcjs-note-active * {
          fill: #f59e0b !important;
          stroke: #f59e0b !important;
        }

        #paper .beat-indicator {
          font-family: sans-serif !important;
          font-weight: 800 !important;
          alignment-baseline: middle !important;
          text-anchor: middle !important;
          transition: all 0.3s ease;
        }

        #paper .beat-strong {
          fill: #ef4444 !important; /* Red-500 */
          font-size: 17px !important;
          filter: drop-shadow(0px 0px 4px rgba(239, 68, 68, 0.6));
        }

        #paper .beat-medium {
          fill: #f59e0b !important; /* Amber-500 */
          font-size: 16px !important;
          filter: drop-shadow(0px 0px 3px rgba(245, 158, 11, 0.5));
        }

        #paper .beat-soft {
          fill: #64748b !important; /* Slate-500 */
          font-size: 10px !important;
          opacity: 0.6;
        }

        #paper svg text.abcjs-chord {
          transform: translateY(-6px);
          font-size: 13px !important;
          font-weight: 600 !important;
          fill: #a5b4fc !important;
        }

        /* Pull tablature staff up ONLY on the first system (g.abcjs-l0) to prevent overlaps on subsequent compact lines */
        /* Pull tablature staff up when beat indicators AND lyrics are present */
        #paper.has-beat-indicators.has-lyrics g.abcjs-l0.abcjs-tablature-staff,
        #paper.has-beat-indicators.has-lyrics g.abcjs-l0.abcjs-tabNumber,
        #paper.has-beat-indicators.has-lyrics g.abcjs-l0.abcjs-symbol:has(path[data-name="tab.big"]) {
          transform: translateY(-60px);
        }

        /* Keep default tablature spacing for beat-only rows so Melody, beat icons, and TAB stay separated */
        #paper.has-beat-indicators.no-lyrics g.abcjs-l0.abcjs-tablature-staff,
        #paper.has-beat-indicators.no-lyrics g.abcjs-l0.abcjs-tabNumber,
        #paper.has-beat-indicators.no-lyrics g.abcjs-l0.abcjs-symbol:has(path[data-name="tab.big"]) {
          transform: translateY(0);
        }

        /* Pull tablature staff up when NO beat indicators are present but lyrics are present */
        #paper:not(.has-beat-indicators).has-lyrics g.abcjs-l0.abcjs-tablature-staff,
        #paper:not(.has-beat-indicators).has-lyrics g.abcjs-l0.abcjs-tabNumber,
        #paper:not(.has-beat-indicators).has-lyrics g.abcjs-l0.abcjs-symbol:has(path[data-name="tab.big"]) {
          transform: translateY(-50px);
        }

        /* Keep default spacing (no pull up) when NO beat indicators and NO lyrics are present */
        #paper:not(.has-beat-indicators).no-lyrics g.abcjs-l0.abcjs-tablature-staff,
        #paper:not(.has-beat-indicators).no-lyrics g.abcjs-l0.abcjs-tabNumber,
        #paper:not(.has-beat-indicators).no-lyrics g.abcjs-l0.abcjs-symbol:has(path[data-name="tab.big"]) {
          transform: translateY(0);
        }
    </style>
</head>
<body>
    <h1>ABCJS Rendering & Placement Test</h1>
    <p>Using <code>AbcjsPlaybackController</code> visual overrides and styles. Use the controls below to toggle parameters.</p>
    
    <div class="controls">
        <label>
            <input type="checkbox" id="enableTab" onchange="renderSong()" checked> Enable TAB (Tablature Staff)
        </label>
        <label>
            <input type="checkbox" id="enableBeats" onchange="renderSong()" checked> Enable Strong Beats (⬤/● Indicator row)
        </label>
        <label>
            Vocal Space:
            <select id="vocalSpace" onchange="renderSong()">
                <option value="10">10 (Compact)</option>
                <option value="20">20</option>
                <option value="30">30 (Spacious)</option>
            </select>
        </label>
    </div>

    <div class="abc-container">
        <div id="paper"></div>
    </div>

    <script type="text/javascript">
        const baseAbc = `X: 1
T: Hari Bol
M: 4/4
L: 1/8
Q: 1/4=65
K: Em
%%score (Melody Guitar)
%%botmargin 80
V:Melody name="Original Melody" stem=up
V:Guitar clef=treble-8 name="Layer 2 Guitar Accompaniment" stem=down
%%MIDI program 24
% Staff system 1: Melody and visible instruments share this measure range.
[V:Melody] | E E (EB,) E E (EB,) | E F G F2 (G2F) | E E (EB,) E E (EB,) | E F G F2 (G2F) |
w: Ha-ri Bol _ Ha-ri Bol _ | Ha-ri Ha-ri Bol _ | Ha-ri Bol _ Ha-ri Bol _ | Ha-ri Ha-ri Bol _
w: BEAT_INDICATOR_LINE_1
[V:Guitar] | E,2 E2 B,2 E2 | E,2 E2 B,2 E2 | E,2 E2 B,2 E2 | E,2 E2 B,2 E2 |
% Staff system 2: Melody and visible instruments share this measure range.
[V:Melody] | E E2 F (GB) A G | (FE) D F E4 | E E2 F (GB) A G | (FE) D F E4 |
w: Mu-kun-da Ma- _ dha-va | Go- _ vin-da Bol | Mu-kun-da Ma- _ dha-va | Go- _ vin-da Bol
w: BEAT_INDICATOR_LINE_2
[V:Guitar] | E,2 E2 B,2 E2 | D,2 D2 A,2 F2 | E,2 E2 B,2 E2 | D,2 D2 A,2 F2 |
% Staff system 3: Melody and visible instruments share this measure range.
[V:Melody] | B B B (Bd) c B | (AG) A B A4 | B B2 B (Bd) c B | (AG) A B A2 B2 |
w: Ke-sha-va Ma- _ dha-va | Go- _ vin-da Bol | Ke-sha-va Ma- _ dha-va | Go- _ vin-da Bol _
w: BEAT_INDICATOR_LINE_3
[V:Guitar] | G,2 G2 D,2 B2 | D,2 D2 A,2 A2 | G,2 G2 D,2 B2 | D,2 D2 A,2 A2 |
% Staff system 4: Melody and visible instruments share this measure range.
[V:Melody] | E E2 F (GB) A G | (FE) DF E4 | E E2 F (GB) A G | (FE) D F E4 |
w: Mu-kun-da Ma- _ dha-va | Go- _ vin-da Bol | Mu-kun-da Ma- _ dha-va | Go- _ vin-da Bol
w: BEAT_INDICATOR_LINE_4
[V:Guitar] | E,2 E2 B,2 E2 | D,2 D2 A,2 F2 | E,2 E2 B,2 E2 | D,2 D2 A,2 F2 |`;

        const beatLines = {
            1: "⬤ * * * ● * * * | ⬤ * * * * * | ⬤ * * * ● * * * | ⬤ * * * * * |",
            2: "⬤ * * ● * * * | ⬤ * * * ● | ⬤ * * ● * * * | ⬤ * * * ● |",
            3: "⬤ * * * ● * * | ⬤ * * * ● | ⬤ * * ● * * * | ⬤ * * * ● * |",
            4: "⬤ * * ● * * * | ⬤ * * * ● | ⬤ * * ● * * * | ⬤ * * * ● |"
        };

        function renderSong() {
            const enableTab = document.getElementById("enableTab").checked;
            const enableBeats = document.getElementById("enableBeats").checked;
            const vocalSpace = document.getElementById("vocalSpace").value;

            // 1. Process ABC String
            let abc = baseAbc;
            
            // Inject vocalspace
            abc = abc.replace("%%score (Melody Guitar)", `%%score (Melody Guitar)\n%%vocalspace ${vocalSpace}`);

            // Replace beat indicators
            for (let i = 1; i <= 4; i++) {
                const replacement = enableBeats ? `w: ${beatLines[i]}` : "";
                abc = abc.replace(`w: BEAT_INDICATOR_LINE_${i}`, replacement);
            }

            // 2. Render options
            const options = {
                add_classes: true,
                responsive: "resize",
                staffwidth: 900
            };

            if (enableTab) {
                options.tablature = [
                    {
                        instrument: "guitar",
                        label: "GUITAR TAB",
                        tuning: ["E,,", "A,,", "D,", "G,", "B,", "E"],
                    }
                ];
            }

            ABCJS.renderAbc("paper", abc, options);

            // 3. Post-process
            setTimeout(() => {
                postProcessBeats(document.getElementById("paper"));
            }, 50);
        }

        // ----- Logics from abc-rendering.ts -----
        function beatIndicatorWeight(value) {
          if (value === "⬤") return 3;
          if (value === "●") return 2;
          if (value === "•" || value === "·") return 1;
          return 0;
        }

        function isBeatIndicatorNode(node) {
          // Disable beat indicator processing so they render as normal lyrics text.
          return false;
        }

        function dedupeBeatIndicatorNodes(nodes) {
            return nodes; // Standard visual deduping
        }

        function postProcessBeats(container) {
          if (!container) return;

          const staves = Array.from(container.querySelectorAll("g.abcjs-staff"));
          const allLyrics = Array.from(container.querySelectorAll("text.abcjs-lyric"));
          const beatLyricNodes = allLyrics.filter(isBeatIndicatorNode);
          const lyrics = allLyrics.filter((node) => {
            const text = (node.textContent || "").trim();
            return text.length > 0 && !isBeatIndicatorNode(node);
          });

          const beats = dedupeBeatIndicatorNodes(beatLyricNodes);

          if (beats.length > 0) {
            container.classList.add("has-beat-indicators");
          } else {
            container.classList.remove("has-beat-indicators");
          }

          if (lyrics.length > 0) {
            container.classList.add("has-lyrics");
            container.classList.remove("no-lyrics");
          } else {
            container.classList.add("no-lyrics");
            container.classList.remove("has-lyrics");
          }

          // Tablature class matching
          const tabPaths = Array.from(container.querySelectorAll('path[data-name="tab.big"]'));
          tabPaths.forEach((path) => {
            try {
              const pathBox = path.getBBox();
              const pathY = pathBox.y + pathBox.height / 2;

              let closestStaff = null;
              let minDistance = Infinity;

              staves.forEach((staff) => {
                try {
                  const staffBox = staff.getBBox();
                  const staffY = staffBox.y + staffBox.height / 2;
                  const dist = Math.abs(staffY - pathY);
                  if (dist < minDistance) {
                    minDistance = dist;
                    closestStaff = staff;
                  }
                } catch {}
              });

              if (closestStaff) {
                closestStaff.classList.add("abcjs-tablature-staff");
              }
            } catch {}
          });

          const staffData = staves
            .map((staff) => {
              try {
                const svgPath = staff;
                const box = svgPath.getBBox();
                return {
                  element: staff,
                  y: box.y,
                  height: box.height,
                  bottom: box.y + box.height,
                  lyricY: null,
                };
              } catch {
                return null;
              }
            })
            .filter(Boolean);

          for (const lyric of lyrics) {
            const lyricY = parseFloat(lyric.getAttribute("y") || "0");
            let bestStaff = null;
            let minDiff = Infinity;
            for (const sd of staffData) {
              const diff = lyricY - sd.bottom;
              if (diff > 0 && diff < 150 && diff < minDiff) {
                minDiff = diff;
                bestStaff = sd;
              }
            }
            if (bestStaff) {
              if (bestStaff.lyricY === null || lyricY > bestStaff.lyricY) {
                bestStaff.lyricY = lyricY;
              }
            }
          }

          for (const node of beats) {
            const val = (node.textContent || "").trim();
            node.classList.add("beat-indicator");
            node.setAttribute("aria-hidden", "true");

            if (val === "⬤") {
              node.classList.add("beat-strong");
              node.setAttribute("data-beat", "Strong");
            } else if (val === "●") {
              node.classList.add("beat-medium");
              node.setAttribute("data-beat", "Medium");
            } else if (val === "•" || val === "·") {
              node.classList.add("beat-soft");
              node.setAttribute("data-beat", "Soft");
              node.textContent = "●"; 
            }

            const nodeY = parseFloat(node.getAttribute("y") || "0");

            let bestStaff = null;
            let minStaffDist = Infinity;
            
            // Applied Bug Fix:
            if (node.classList.contains("abcjs-lyric")) {
              for (const sd of staffData) {
                const diff = nodeY - sd.bottom;
                if (diff > -15 && diff < 150 && diff < minStaffDist) {
                  minStaffDist = diff;
                  bestStaff = sd;
                }
              }
            } else {
              for (const sd of staffData) {
                const dist = Math.abs(sd.y + sd.height / 2 - nodeY);
                if (dist < minStaffDist) {
                  minStaffDist = dist;
                  bestStaff = sd;
                }
              }
            }

            if (bestStaff) {
              let targetY;
              if (bestStaff.lyricY !== null && bestStaff.lyricY > 0) {
                targetY = bestStaff.lyricY + 16;
              } else {
                targetY = bestStaff.bottom + 22; 
              }
              node.setAttribute("y", String(targetY));
            } else {
              node.setAttribute("y", String(nodeY + 12)); 
            }
          }
        }

        // Render initially
        renderSong();
    </script>
</body>
</html>
